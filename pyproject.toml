[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conta-rizoma4"
version = "0.1.0"
description = "Módulo doctrinal del PGC español para Rizoma4."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Rubén Buján", email = "rubenbujanblasco@protonmail.com" }]
dependencies = [
    "rizoma4>=0.4.0",
    "pymysql>=1.1",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "uvicorn[standard]>=0.27",
    "fastapi>=0.110",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0", "pytest-cov>=6.0", "pytest-mock>=3.12"]

# M6: scripts ANTES de tool.*
[project.scripts]
conta = "conta_rizoma4.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# M6: marker declarado; integración se lanza explícitamente (make test-integration)
addopts = "-m 'not integration and not slow'"
markers = [
    "integration: requiere servicios reales (MariaDB/PostgreSQL). `pytest -m integration`.",
    "slow: dura > 5 s.",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["conta_rizoma4", "conta_rizoma4.*"]
exclude = [
    "tests*", "tests.*", "old*", "old.*", "docs*", "doc*",
    "scripts*", "scripts.*", "data*", "data.*",
    "mdbtools*", "mdbtools.*", "mdb_extraido*", "mdb_extraido.*",
]
