# Metadata de conta-rizoma4.
# Instalación: pip install -e ../conta-rizoma4  (desde rizoma4/)
# El paquete depende de rizoma4, que debe estar instalado antes.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conta-rizoma4"
version = "0.1.0"
description = "Módulo doctrinal del PGC español para Rizoma4."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Rubén Buján", email = "rubenbujanblasco@protonmail.com" },
]
dependencies = [
    "rizoma4>=0.4.0",         # kernel + contratos base (editable)
    "pymysql>=1.1",           # lectura de MariaDB (seed)
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "PyYAML>=6.0",   # escritura en conta_rizoma4
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
]

[tool.setuptools]
packages = [
    "conta_rizoma4",
    "conta_rizoma4.contratos",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-m 'not integration'"
[project.scripts]
conta = "conta_rizoma4.cli:main"
